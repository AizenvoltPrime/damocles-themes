# Checks the theme submissions a pull request adds or changes. It runs the pull request's own files, so it holds no secret and
# only reads: never switch it to pull_request_target.
name: Validate themes

on:
  pull_request:
    paths:
      - 'themes/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: store
          fetch-depth: 0
          persist-credentials: false

      - name: Read DAMOCLES_REF
        id: damocles
        working-directory: store
        run: |
          ref="$(grep -v '^#' DAMOCLES_REF | tr -d '[:space:]')"
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then echo "DAMOCLES_REF is not a git ref: $ref" >&2; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AizenvoltPrime/damocles
          ref: ${{ steps.damocles.outputs.ref }}
          path: damocles
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The validator decodes under the Electron that ref pins, as the app does; the electron package has no install script.
      - name: Build the validator
        working-directory: damocles
        run: |
          npm ci
          npm run build:theme-validator
          npx --no install-electron

      # Ubuntu 24.04 restricts unprivileged user namespaces for binaries without an AppArmor profile, so Chromium needs its
      # setuid helper; the sandbox stays on while it decodes the submitted files.
      - name: Enable the setuid sandbox helper and a display for Electron
        working-directory: damocles
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Validate the changed submissions
        working-directory: store
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: xvfb-run -a node scripts/build-community.mjs check --base "$BASE_SHA" --validator ../damocles/dist/theme-validate.js --work ../work

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: thumbnails
          path: work/thumbs/
          if-no-files-found: ignore
          retention-days: 14
