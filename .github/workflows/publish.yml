# The build job runs npm packages with no secret or write token; the sign job runs only sign.mjs and git, behind store-signing.
# Schedule and resign-only dispatch re-sign the committed list without building, so the 30-day expiresAt never lapses.
name: Publish the store list

on:
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'community.json'
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:
    inputs:
      resign-only:
        description: Re-sign the committed community.json and thumbs/ without building
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # the sign job's own commit, pushed with GITHUB_TOKEN, starts no run; the actor check guards a run the bot starts any other way
    if: >-
      github.repository == 'AizenvoltPrime/damocles-themes' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.resign-only))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: store
          persist-credentials: false

      - name: Read DAMOCLES_REF
        id: damocles
        working-directory: store
        run: |
          ref="$(grep -v '^#' DAMOCLES_REF | tr -d '[:space:]')"
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then echo "DAMOCLES_REF is not a git ref: $ref" >&2; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AizenvoltPrime/damocles
          ref: ${{ steps.damocles.outputs.ref }}
          path: damocles
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build the validator
        working-directory: damocles
        run: |
          npm ci
          npm run build:theme-validator
          npx playwright install --with-deps chromium

      - name: Validate every submission and build community.json and thumbs/
        working-directory: store
        run: node scripts/build-community.mjs publish --validator ../damocles/dist/theme-validate.js --work ../work

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: community
          path: |
            store/community.json
            store/thumbs/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: >-
      !cancelled() && github.repository == 'AizenvoltPrime/damocles-themes' && github.ref == 'refs/heads/main'
      && (needs.build.result == 'success'
        || (needs.build.result == 'skipped' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.resign-only))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with:
          name: community
          path: ${{ runner.temp }}/built

      - name: Take the built thumbs/
        if: needs.build.result == 'success'
        run: |
          rm -rf thumbs
          mkdir thumbs
          if [ -d "$RUNNER_TEMP/built/thumbs" ]; then
            find "$RUNNER_TEMP/built/thumbs" -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9a-f]{64}\.webp' -size -513k -exec cp {} thumbs/ \;
          fi

      - name: Sign
        env:
          STORE_SIGNING_KEY: ${{ secrets.STORE_SIGNING_KEY }}
        run: |
          if [ -f "$RUNNER_TEMP/built/community.json" ]; then
            node scripts/sign.mjs --built "$RUNNER_TEMP/built/community.json"
          else
            node scripts/sign.mjs
          fi

      - name: Commit and push the signed list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community.json community.signed.json
          if [ -d thumbs ]; then git add -A thumbs; fi
          git commit -m 'Sign the community store list'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
